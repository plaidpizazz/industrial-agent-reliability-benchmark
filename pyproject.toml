[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agenteval-harness"
version = "0.1.0"
description = "Agentic AI reliability benchmark for regulated industrial workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Marcellus" }]
dependencies = [
  "anthropic>=0.72.0",
  "datasets>=4.4.0",
  "langsmith>=0.4.0",
  "pandas>=2.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0",
]

[tool.setuptools.packages.find]
where = ["evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["evals"]
addopts = "-q"
